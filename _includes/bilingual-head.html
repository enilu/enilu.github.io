<link rel="canonical" href="{{ page.url | absolute_url | escape }}">
{% if translation_page %}
<link rel="alternate" hreflang="{{ page_lang }}" href="{{ page.url | absolute_url | escape }}">
<link rel="alternate" hreflang="{{ translation_page.lang }}" href="{{ translation_page.url | absolute_url | escape }}">
{% if page_lang == 'en' %}
<link rel="alternate" hreflang="x-default" href="{{ translation_page.url | absolute_url | escape }}">
{% else %}
<link rel="alternate" hreflang="x-default" href="{{ page.url | absolute_url | escape }}">
{% endif %}
{% endif %}
